# ============================================================
#  Credentials live in ./secrets/*.txt, never in this file.
#
#  Compose bind-mounts each one read-only at /run/secrets/<name>
#  inside the containers that declare it. Nothing sensitive ends
#  up in `environment:`, so nothing sensitive shows up in
#  `docker inspect`, `docker compose config`, or the environment
#  of any process the container spawns.
#
#  Postgres reads the files natively (POSTGRES_*_FILE). Node does
#  not, so backend/frontend load them in their entrypoint scripts.
#
#  Only non-secret configuration is left in .env. The rule of
#  thumb: if it is in secrets/, it is a credential. A database
#  name and role name are identifiers, not credentials — they
#  are worthless without the password, and db has no published
#  port and no route off the internal network — so they stay in
#  .env, where the healthcheck can interpolate them directly.
# ============================================================

# ||  --- SERVICES ---  ||
services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: transcendence-backend
    container_name: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: 5432
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      42_CALLBACK_URL: ${FT_CALLBACK_URL}
    secrets:
      - postgres_password
      - jwt_secret
      - google_client_id
      - google_client_secret
      - ft_client_id
      - ft_client_secret
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - pfp:/app/uploads

  frontend:
    build: ./frontend
    image: transcendence-frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    secrets:
      - jwt_secret
    networks:
      - frontend_net
    expose:
      - "3000"

  nginx:
    build: ./nginx
    image: transcendence-nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "2222:2222"
    networks:
      - frontend_net
    depends_on:
      - frontend
      - backend

# ||  --- SECRETS ---  ||
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  google_client_id:
    file: ./secrets/google_client_id.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  ft_client_id:
    file: ./secrets/ft_client_id.txt
  ft_client_secret:
    file: ./secrets/ft_client_secret.txt

# ||  --- NETWORKS ---  ||
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true    # no route to the internet at all

# ||  --- VOLUMES ---  ||
volumes:
  pg_data:
  pfp:
