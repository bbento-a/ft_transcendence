# ||  --- SERVICES ---  ||
services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # The postgres image reads the password from this file itself: every
      # POSTGRES_* variable has a _FILE twin for exactly this purpose.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: transcendence-backend
    container_name: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # DATABASE_URL is assembled from these by the entrypoint, once the
      # password has been read from its secret file.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      42_CLIENT_ID: ${FT_CLIENT_ID}
      42_CALLBACK_URL: ${FT_CALLBACK_URL}
    secrets:
      - postgres_password
      - jwt_secret
      - google_client_secret
      - ft_client_secret
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - pfp:/app/uploads

  frontend:
    build: ./frontend
    image: transcendence-frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # Only jwt_secret: the frontend verifies the session cookie, it never
    # talks to the database and never sees the OAuth secrets.
    secrets:
      - jwt_secret
    networks:
      - frontend_net
    expose:
      - "3000"

  nginx:
    build: ./nginx
    image: transcendence-nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "2222:2222"
    networks:
      - frontend_net
    depends_on:
      - frontend
      - backend

# ||  --- SECRETS ---  ||
# One value per file, created by `make secrets`, never committed.
# Compose mounts each one read-only at /run/secrets/<name>, and only inside
# the services that list it above.
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  ft_client_secret:
    file: ./secrets/ft_client_secret.txt

# ||  --- NETWORKS ---  ||
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true    # no route to the internet at all

# ||  --- VOLUMES ---  ||
volumes:
  pg_data:
  pfp:
