<!DOCTYPE html>
<html>
<head>
  <title>4 em Linha - Teste</title>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { zoom: 0.75; }
    body { font-family: sans-serif; padding: 8px; background: #1a1a2e; color: #eee; display: flex; gap: 10px; align-items: flex-start; }
    .left { flex: 0 0 220px; display: flex; flex-direction: column; gap: 8px; }
    .right { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .card { background: #16213e; border: 1px solid #333; border-radius: 8px; padding: 8px 10px; }
    .label { font-size: 11px; color: #aaa; margin-bottom: 2px; }
    .value { font-size: 12px; color: #eee; font-family: monospace; word-break: break-all; }
    .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #E24B4A; margin-right: 5px; }
    .status-dot.connected { background: #639922; }
    .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; background: #185FA5; padding: 8px; border-radius: 8px; }
    .cell { aspect-ratio: 1; border-radius: 50%; background: #0f3460; }
    .cell.p1 { background: #E24B4A; }
    .cell.p2 { background: #EF9F27; }
    .col-btn { background: #16213e; border: 1px solid #444; border-radius: 4px; padding: 3px; font-size: 10px; cursor: pointer; color: #aaa; width: 100%; }
    .col-btn:hover { background: #0f3460; color: #fff; }
    .col-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .log { background: #0f3460; border-radius: 6px; padding: 6px; font-family: monospace; font-size: 10px; color: #aaa; height: 180px; overflow-y: auto; }
    .log-entry { padding: 1px 0; border-bottom: 1px solid #1a1a2e; }
    .log-entry.in { color: #639922; }
    .log-entry.out { color: #4a9edd; }
    .log-entry.err { color: #E24B4A; }
    .log-entry.spec { color: #c77dff; }
    .badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #333; color: #aaa; }
    .badge.p1 { background: #4a1515; color: #E24B4A; }
    .badge.p2 { background: #4a3000; color: #EF9F27; }
    .badge.win { background: #1a4a1a; color: #639922; }
    .badge.spec { background: #2d1a4a; color: #c77dff; }
    button { background: #16213e; border: 1px solid #444; border-radius: 6px; padding: 6px 10px; color: #eee; cursor: pointer; font-size: 12px; }
    button:hover { background: #0f3460; }
    .col-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
    .divider { border: none; border-top: 1px solid #333; margin: 4px 0; }
    .spec-row { display: flex; gap: 4px; }
    .spec-row input {
      flex: 1;
      background: #0f3460;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 5px 8px;
      color: #eee;
      font-size: 11px;
      font-family: monospace;
    }
    .spec-row input::placeholder { color: #555; }
    .spec-badge { 
      display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 4px; 
      background: #2d1a4a; color: #c77dff; border: 1px solid #5a3a8a; 
    }
    .mode-indicator {
      font-size: 10px; padding: 2px 6px; border-radius: 4px;
      background: #2d1a4a; color: #c77dff;
      display: none;
    }
    .mode-indicator.visible { display: inline-block; }
  </style>
</head>
<body>

<div class="left">
  <div class="card">
    <div class="label">ligação</div>
    <div class="value"><span class="status-dot" id="dot"></span><span id="conn-status">desligado</span></div>
    <div class="label" style="margin-top:6px;">socket id</div>
    <div class="value" id="socket-id">—</div>
    <div class="label" style="margin-top:6px;">sala</div>
    <div class="value" id="room-id">—</div>
    <div class="label" style="margin-top:6px;">estado</div>
    <span class="badge" id="game-status">à espera</span>
    <span class="mode-indicator" id="mode-indicator">👁 espectador</span>
  </div>

  <!-- Secção jogador -->
  <button onclick="joinMatch()" style="width:100%;">entrar na fila (jogador)</button>

  <!-- Secção espectador -->
  <hr class="divider">
  <div class="card">
    <div class="label" style="margin-bottom:5px;">👁 modo espectador</div>
    <div class="spec-row">
      <input type="text" id="spec-room-input" placeholder="room-1" />
      <button onclick="joinSpectator()" style="font-size:11px; padding:5px 8px;">observar</button>
    </div>
    <div style="margin-top:5px; font-size:10px; color:#555;">
      copia o room ID de outra janela
    </div>
  </div>

  <button onclick="disconnectSocket()" style="width:100%; color:#aaa;">desligar</button>

  <div class="card">
    <div class="label" style="margin-bottom:4px;">log <span style="float:right; cursor:pointer;" onclick="clearLog()">limpar</span></div>
    <div class="log" id="log"></div>
  </div>
</div>

<div class="right">
  <div class="col-grid">
    <button class="col-btn" id="btn-0" onclick="play(0)">col 1</button>
    <button class="col-btn" id="btn-1" onclick="play(1)">col 2</button>
    <button class="col-btn" id="btn-2" onclick="play(2)">col 3</button>
    <button class="col-btn" id="btn-3" onclick="play(3)">col 4</button>
    <button class="col-btn" id="btn-4" onclick="play(4)">col 5</button>
    <button class="col-btn" id="btn-5" onclick="play(5)">col 6</button>
    <button class="col-btn" id="btn-6" onclick="play(6)">col 7</button>
  </div>
  <div class="board" id="board"></div>
</div>

<script>
let socket = null;
let currentRoom = null;
let isSpectator = false;

function initBoard() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  for(let r = 0; r < 6; r++)
    for(let c = 0; c < 7; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${r}-${c}`;
      b.appendChild(cell);
    }
}

function updateBoard(board) {
  for(let r = 0; r < 6; r++)
    for(let c = 0; c < 7; c++) {
      const cell = document.getElementById(`cell-${r}-${c}`);
      if(!cell) continue;
      cell.className = 'cell';
      if(board[r][c] === 1) cell.classList.add('p1');
      if(board[r][c] === 2) cell.classList.add('p2');
    }
}

function log(msg, type='') {
  const el = document.getElementById('log');
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(entry);
  el.scrollTop = el.scrollHeight;
}

function clearLog() { document.getElementById('log').innerHTML = ''; }

function setStatus(connected) {
  document.getElementById('dot').className = 'status-dot' + (connected ? ' connected' : '');
  document.getElementById('conn-status').textContent = connected ? 'ligado' : 'desligado';
}

function setGameStatus(text, cls) {
  const b = document.getElementById('game-status');
  b.textContent = text;
  b.className = `badge ${cls}`;
}

function setColButtonsDisabled(disabled) {
  for(let i = 0; i < 7; i++) {
    document.getElementById(`btn-${i}`).disabled = disabled;
  }
}

// Regista todos os eventos comuns (jogador e espectador usam os mesmos)
function registerSocketEvents() {
  socket.on('connect', () => {
    document.getElementById('socket-id').textContent = socket.id;
    setStatus(true);
    log(`ligado: ${socket.id}`, 'in');
  });

  socket.on('statusWait', (msg) => log(`← statusWait: ${msg}`, 'in'));
  socket.on('warning',    (msg) => log(`← warning: ${msg}`, 'err'));

  socket.on('MatchFound', (data) => {
    currentRoom = data.room;
    isSpectator = false;
    document.getElementById('room-id').textContent = data.room;
    document.getElementById('mode-indicator').classList.remove('visible');
    setGameStatus('jogo a decorrer — turno P1', 'p1');
    setColButtonsDisabled(false);
    log(`← MatchFound: ${data.room}`, 'in');
    if(data.state) updateBoard(data.state.board);
  });

  socket.on('gameStateUpdated', (state) => {
    updateBoard(state.board);
    const prefix = isSpectator ? '[👁] ' : '';
    if(state.isGameOver) {
      setGameStatus('jogo terminado!', 'win');
      setColButtonsDisabled(true);
      log(`← ${prefix}gameStateUpdated: JOGO TERMINADO`, isSpectator ? 'spec' : 'in');
    } else {
      setGameStatus(`turno: jogador ${state.currentPlayer}`, `p${state.currentPlayer}`);
      log(`← ${prefix}gameStateUpdated: turno P${state.currentPlayer}`, isSpectator ? 'spec' : 'in');
    }
  });

  socket.on('gameOver', (data) => {
    const prefix = isSpectator ? '[👁] ' : '';
    const msg = data.winner ? `vencedor: ${data.winner}` : 'empate!';
    log(`← ${prefix}gameOver: ${msg}`, isSpectator ? 'spec' : 'in');
    setColButtonsDisabled(true);
  });

  socket.on('opponentDisconnected', (msg) => {
    log(`← opponentDisconnected: ${msg}`, 'err');
    setGameStatus('adversário saiu', '');
    setColButtonsDisabled(true);
  });

  socket.on('disconnect', () => {
    setStatus(false);
    document.getElementById('socket-id').textContent = '—';
    log('desligado', 'err');
    isSpectator = false;
    document.getElementById('mode-indicator').classList.remove('visible');
  });
}

function ensureConnected(callback) {
  if(!socket || !socket.connected) {
    socket = io('http://localhost:3000');
    registerSocketEvents();
    socket.on('connect', callback);
  } else {
    callback();
  }
}

function joinMatch() {
  isSpectator = false;
  document.getElementById('mode-indicator').classList.remove('visible');
  setColButtonsDisabled(false);

  ensureConnected(() => {
    socket.emit('LookforMatch');
    log('→ LookforMatch', 'out');
  });
}

function joinSpectator() {
  const roomId = document.getElementById('spec-room-input').value.trim();
  if(!roomId) {
    log('introduz um room ID', 'err');
    return;
  }

  isSpectator = true;
  setColButtonsDisabled(true); // espectadores não jogam
  document.getElementById('mode-indicator').classList.add('visible');

  ensureConnected(() => {
    currentRoom = roomId;
    document.getElementById('room-id').textContent = roomId;
    socket.emit('joinSpectator', roomId);
    log(`→ joinSpectator: ${roomId}`, 'spec');
    setGameStatus('a observar...', 'spec');
  });
}

function play(column) {
  if(isSpectator) {
    log('espectadores não podem jogar', 'err');
    return;
  }
  if(!socket || !socket.connected || !currentRoom) {
    log('sem sala ativa', 'err');
    return;
  }
  socket.emit('playerMove', { roomId: currentRoom, column });
  log(`→ playerMove col ${column + 1}`, 'out');
}

function disconnectSocket() {
  if(socket) { 
    socket.disconnect(); 
    currentRoom = null; 
    isSpectator = false;
    document.getElementById('mode-indicator').classList.remove('visible');
    setColButtonsDisabled(false);
  }
}

initBoard();
setColButtonsDisabled(false);
</script>
</body>
</html>
