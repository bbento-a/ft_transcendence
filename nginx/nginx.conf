user  nginx;
worker_processes  auto;

events {
	worker_connections  1024;
}

http {
	# Don't advertise the nginx version on error pages / in headers
	server_tokens off;

	# WebSocket upgrade helper: "upgrade" for WS handshakes, "close" otherwise.
	# Lets every location share one set of proxy headers.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	server {
		listen 2222 ssl;
		http2 on;
		server_name localhost;

		ssl_certificate     /etc/nginx/certs/cert.pem;
		ssl_certificate_key /etc/nginx/certs/key.pem;
		ssl_protocols       TLSv1.2 TLSv1.3;

		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options    "nosniff"          always;
		add_header X-Frame-Options           "SAMEORIGIN"       always;
		add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

		# Docker's embedded DNS; re-resolve so restarted containers are picked up
		resolver 127.0.0.11 valid=10s ipv6=off;

		# Shared by every location below
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade           $http_upgrade;
		proxy_set_header Connection        $connection_upgrade;

		# /api/auth/login -> backend:3000/auth/login
		location /api/ {
			set $backend_upstream http://backend:3000;
			rewrite ^/api/(.*)$ /$1 break;
			proxy_pass $backend_upstream;

			# O default do nginx sao 1MB, e o upload de avatar aceita 5MB
			# (AVATAR_MAX_BYTES no auth.controller.ts): qualquer foto de telemovel
			# levava com um 413 daqui sem o backend chegar a ver o pedido, e o
			# ecra de definicoes so sabia dizer "usa uma imagem com menos de 5MB".
			# Fica com folga de proposito: isto limita o CORPO todo (fronteiras do
			# multipart incluidas) enquanto o multer limita so o ficheiro, e quem
			# deve recusar e o backend, que devolve uma mensagem tratada.
			client_max_body_size 6m;
		}

		# Path passed through untouched: socket.io expects /socket.io/
		location /socket.io/ {
			set $ws_upstream http://backend:3000;
			proxy_pass $ws_upstream;
			proxy_read_timeout 3600s;
		}

		location / {
			set $frontend_upstream http://frontend:3000;
			proxy_pass $frontend_upstream;
		}
	}
}
