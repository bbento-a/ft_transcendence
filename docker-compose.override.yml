# ============================================================
#  DEV OVERRIDE
#
#  Compose loads this automatically on top of docker-compose.yml.
#    make dev  -> base + this file   (hot reload, source mounted)
#    make up   -> base only          (production images)
#
#  Everything here is development-only. Nothing in this file
#  should ever be required for the production stack to work.
#
#  Secrets are NOT redefined here: the `secrets:` blocks in the
#  base file already apply, so dev containers get the same
#  /run/secrets/* mounts as production.
#
#  The dev images stop at the `deps` stage, which does not contain
#  the entrypoint scripts (those are copied in `runtime`), so each
#  script is bind-mounted in and invoked explicitly. Running it as
#  `/bin/sh <script>` means the host file does not need +x.
# ============================================================
services:

  backend:
    build:
      context: ./backend
      target: deps          # stop at the stage that only has node_modules
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/app:/app  # live source from the host
      - /app/node_modules   # anonymous volume: shields the image's copy
      - ./backend/tools/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - /app/uploads
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh", "/bin/sh", "-c"]
    command:
      - "npx prisma generate && npm run start:dev"

  frontend:
    build:
      context: ./frontend
      target: deps
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
      - ./frontend/tools/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint.sh", "/bin/sh", "-c"]
    command:
      - "npm run dev -- -H 0.0.0.0 -p 3000"

  nginx:
    volumes:
      # Edit nginx.conf on the host, then: docker compose restart nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
