# ============================================================
#  DEV OVERRIDE
#
#  Compose loads this automatically on top of docker-compose.yml.
#    make dev  -> base + this file   (hot reload, source mounted)
#    make up   -> base only          (production images)
#
#  Everything here is development-only. Nothing in this file
#  should ever be required for the production stack to work.
# ============================================================
services:

  backend:
    build:
      context: ./backend
      target: deps          # stop at the stage that only has node_modules
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/app:/app  # live source from the host
      - /app/node_modules   # anonymous volume: shields the image's copy
    # Only `command` is overridden, never `entrypoint`: the entrypoint is what
    # reads /run/secrets and runs the migrations, and dev needs both exactly
    # like production does. It ends with `exec "$@"`, so this runs after it.
    command: ["/bin/sh", "-c", "npx prisma generate && npm run start:dev"]

  frontend:
    build:
      context: ./frontend
      target: deps
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend/app:/app
      - /app/node_modules
    command: ["/bin/sh", "-c", "npm run dev -- -H 0.0.0.0 -p 3000"]

  nginx:
    volumes:
      # Edit nginx.conf on the host, then: docker compose restart nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
